<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">OpenStack 개발 서버부터 AutoLog CI/CD까지의 구성</title>
<desc id="desc">Codex 개발 서버에서 GitHub, GitHub Actions CI, GHCR까지 성공. 수동 승인형 Kubernetes CD는 API 네트워크 연결 확인 단계로 미완료.</desc>
