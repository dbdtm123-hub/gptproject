<text x="65" y="579" font-size="16" fill="#2c8868">HTTPS image GET &#8594; 200 OK (image/png)</text>
<text x="52" y="631" font-size="16" fill="#4d657e">Troubleshooting: MinIO &#8594; Garage | Secret newline | GHCR pull | DNS CNAME | Firefox cache</text>
