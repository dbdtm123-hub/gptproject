<rect x="62" y="257" width="239" height="83" rx="12" class="card"/><text x="181" y="292" text-anchor="middle" class="node">Admin Browser</text><text x="181" y="321" text-anchor="middle" class="detail">Select image</text>
<path d="M306 299H333" stroke="#309ed7" stroke-width="4" marker-end="url(#arr)"/>
<rect x="355" y="257" width="239" height="83" rx="12" class="card"/><text x="475" y="292" text-anchor="middle" class="node">Next.js Proxy</text><text x="475" y="321" text-anchor="middle" class="detail">POST /api/uploads</text>
