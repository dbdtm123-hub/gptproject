<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Garage S3 object storage architecture showing upload and read-only public delivery">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c192b"/><stop offset="1" stop-color="#132d47"/></linearGradient><style>text{font-family:Arial,'Noto Sans',sans-serif}.title{font-weight:700;font-size:43px;fill:white}.sub{font-size:19px;fill:#b7d0e3}.heading{font-size:24px;font-weight:700;fill:#153c5c}.card{fill:#f3f9ff;stroke:#bbd8ed;stroke-width:2}.green{fill:#e9f9f1;stroke:#b4dfcb;stroke-width:2}.node{font-size:21px;font-weight:700;fill:#164569}.detail{font-size:15px;fill:#59809b}.gnode{font-size:21px;font-weight:700;fill:#126c52}.gdetail{font-size:15px;fill:#598b78}</style><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11" stroke="#309ed7" stroke-width="2" fill="none"/></marker><marker id="arrg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11" stroke="#32b989" stroke-width="2" fill="none"/></marker></defs>
<rect width="1200" height="660" fill="#eef4f9"/><rect width="1200" height="164" fill="url(#bg)"/><text x="48" y="81" class="title">Garage S3 on Kubernetes</text><text x="50" y="123" class="sub">Private bucket + dedicated read-only image gateway</text><rect x="930" y="45" width="225" height="63" rx="14" fill="#1b584e"/><text x="1042" y="71" fill="#9de6c5" font-size="15" text-anchor="middle">VERIFIED</text><text x="1042" y="95" fill="white" font-size="20" font-weight="700" text-anchor="middle">201 &#183; 200 &#183; Browser</text>
