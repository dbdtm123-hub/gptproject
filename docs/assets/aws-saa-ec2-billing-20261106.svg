<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EC2 STOP IS NOT $0"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081b32"/><stop offset="1" stop-color="#173a55"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#36a9db" stroke-width="2"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif}.title{font-size:43px;font-weight:750;fill:#fff}.subtitle{font-size:19px;fill:#bbd1e3}.heading{font-size:24px;font-weight:700;fill:#153653}.detail{font-size:18px;fill:#47667e}.label{font-size:22px;font-weight:700;fill:#123955}.mini{font-size:17px;fill:#41647d}.pill{font-size:16px;font-weight:700;fill:#176653}.box{fill:#fff;stroke:#d1e0ec;stroke-width:2}.blue{fill:#eaf5ff;stroke:#95c8e8;stroke-width:2}.green{fill:#e4f7f0;stroke:#93d4b6;stroke-width:2}.amber{fill:#fff4df;stroke:#f1ce8d;stroke-width:2}.line{stroke:#36a9db;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="630" fill="#eff5fa"/><rect width="1200" height="145" fill="url(#g)"/><text x="48" y="71" class="title">EC2 STOP IS NOT $0</text><text x="49" y="112" class="subtitle">Separate compute charges from persistent resources</text><rect x="49" y="187" width="525" height="123" rx="16" class="green"/><text x="71" y="225" class="label">RUNNING</text><text x="71" y="257" class="mini">On-Demand compute = billed</text><rect x="627" y="187" width="525" height="123" rx="16" class="blue"/><text x="649" y="225" class="label">STOPPED</text><text x="649" y="257" class="mini">On-Demand compute = no charge</text><path d="M585 246H612" class="line"/><rect x="46" y="350" width="1108" height="158" rx="18" class="box"/><text x="70" y="389" class="heading">Charges that can continue after EC2 stops</text><rect x="76" y="407" width="235" height="79" rx="16" class="amber"/><text x="98" y="445" class="label">EBS</text><text x="98" y="477" class="mini">Volume storage</text><rect x="340" y="407" width="235" height="79" rx="16" class="amber"/><text x="362" y="445" class="label">Public IPv4</text><text x="362" y="477" class="mini">Allocated address</text><rect x="602" y="407" width="235" height="79" rx="16" class="amber"/><text x="624" y="445" class="label">Snapshots</text><text x="624" y="477" class="mini">Stored backups</text><rect x="864" y="407" width="235" height="79" rx="16" class="amber"/><text x="886" y="445" class="label">NAT Gateway</text><text x="886" y="477" class="mini">If still provisioned</text><text x="48" y="602" class="mini">Reserved Instance / Savings Plans commitments continue independently of EC2 stop state.</text></svg>