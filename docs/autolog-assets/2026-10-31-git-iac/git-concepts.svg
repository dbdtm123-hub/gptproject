<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="22" fill="#0f172a"/><text x="42" y="60" font-family="Arial,'Noto Sans KR',sans-serif" font-size="35" fill="#f8fafc" font-weight="700">Git과 GitHub: 같은 것이 아니다</text><text x="42" y="96" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#94a3b8" font-weight="400">Git = 로컬 파일의 변경 이력을 기록하는 도구   /   GitHub = 원격 Git 저장소 서비스</text><rect x="42" y="140" width="326" height="305" rx="15" fill="#1d3b4d" stroke="#334155" stroke-width="1.5"/><text x="65" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="28" fill="#f8fafc" font-weight="700">Working Tree</text><text x="65" y="244" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">파일 생성·수정</text><text x="65" y="290" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">globals.yml.example</text><text x="65" y="336" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">versions.md</text><text x="65" y="382" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">아직 버전 기록은 없음</text><rect x="437" y="140" width="326" height="305" rx="15" fill="#20413b" stroke="#334155" stroke-width="1.5"/><text x="460" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="28" fill="#f8fafc" font-weight="700">Local Git (.git)</text><text x="460" y="244" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">git add → git commit</text><text x="460" y="290" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">로컬에서 이력 확정</text><text x="460" y="336" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">main 브랜치</text><text x="460" y="382" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">GitHub 업로드와 별개</text><rect x="832" y="140" width="326" height="305" rx="15" fill="#392d53" stroke="#334155" stroke-width="1.5"/><text x="855" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="28" fill="#f8fafc" font-weight="700">GitHub Remote</text><text x="855" y="244" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">Private Repository</text><text x="855" y="290" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">git push로 업로드</text><text x="855" y="336" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">협업·보관·clone</text><text x="855" y="382" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">서버에는 원격 이력</text><path d="M373,309 H432" stroke="#60a5fa" stroke-width="4"/><path d="M419,300 L432,309 L419,318" stroke="#60a5fa" stroke-width="4" fill="none"/><path d="M767,309 H827" stroke="#60a5fa" stroke-width="4"/><path d="M814,300 L827,309 L814,318" stroke="#60a5fa" stroke-width="4" fill="none"/><rect x="42" y="482" width="1116" height="119" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="67" y="527" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" fill="#fbbf24" font-weight="700">remote add origin은 '주소 등록'일 뿐, GitHub 저장소를 만들거나 push하지 않는다.</text><text x="67" y="565" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">GitHub Private 저장소도 비밀번호나 API 토큰을 평문으로 저장하면 안전하지 않다.</text></svg>