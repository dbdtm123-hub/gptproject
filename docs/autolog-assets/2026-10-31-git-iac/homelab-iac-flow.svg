<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="22" fill="#0f172a"/><text x="42" y="62" font-family="Arial,'Noto Sans KR',sans-serif" font-size="32" fill="#f8fafc" font-weight="700">OpenStack 3노드: 예제 설정을 Private GitHub에 버전 관리</text><text x="42" y="101" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#94a3b8" font-weight="400">실제 운영 데이터를 Git에 복사하지 않고 배포 환경의 설정 구조부터 기록했다</text><rect x="42" y="150" width="356" height="351" rx="15" fill="#1e3c50" stroke="#334155" stroke-width="1.5"/><text x="60" y="200" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" fill="#f8fafc" font-weight="700">운영 중인 OpenStack</text><text x="60" y="256" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">node01: Control/Network/Compute</text><text x="60" y="301" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">node02: Control/Compute</text><text x="60" y="346" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">node03: Control</text><text x="60" y="391" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">실제 globals.yml / inventory</text><text x="60" y="436" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">운영 서비스는 변경하지 않음</text><rect x="442" y="150" width="356" height="351" rx="15" fill="#20433b" stroke="#334155" stroke-width="1.5"/><text x="460" y="200" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" fill="#f8fafc" font-weight="700">보안 처리된 설정</text><text x="460" y="256" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">globals.yml.example</text><text x="460" y="301" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">multinode.example</text><text x="460" y="346" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">versions.md</text><text x="460" y="391" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">.gitignore</text><text x="460" y="436" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">내부 주소 → 문서용 주소</text><rect x="842" y="150" width="356" height="351" rx="15" fill="#3b2d51" stroke="#334155" stroke-width="1.5"/><text x="860" y="200" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" fill="#f8fafc" font-weight="700">GitHub Private</text><text x="860" y="256" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">homelab-infra / main</text><text x="860" y="301" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">최초 커밋 성공</text><text x="860" y="346" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">git push 정상 종료</text><text x="860" y="391" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">4개 파일 업로드</text><text x="860" y="436" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">저장소 원격 확인</text><path d="M400,315 H438" stroke="#60a5fa" stroke-width="4"/><path d="M425,306 L438,315 L425,324" stroke="#60a5fa" stroke-width="4" fill="none"/><path d="M799,315 H837" stroke="#60a5fa" stroke-width="4"/><path d="M824,306 L837,315 L824,324" stroke="#60a5fa" stroke-width="4" fill="none"/><rect x="42" y="546" width="1156" height="116" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="67" y="589" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" fill="#f8fafc" font-weight="700">주의: 현재는 예제 파일의 형상관리 성공이다.</text><text x="67" y="625" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#fbbf24" font-weight="400">MariaDB·RabbitMQ·VM·PVC 복구와 실제 운영 설정의 안전한 재현은 후속 과제다.</text></svg>