<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" rx="22" fill="#0f172a"/><text x="42" y="60" font-family="Arial,'Noto Sans KR',sans-serif" font-size="33" fill="#f8fafc" font-weight="700">Git 커밋 작성자와 GitHub 인증은 별개의 개념</text><rect x="42" y="124" width="540" height="338" rx="15" fill="#183b50" stroke="#334155" stroke-width="1.5"/><text x="65" y="177" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" fill="#f8fafc" font-weight="700">① Author Identity</text><text x="65" y="224" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">git config user.name</text><text x="65" y="266" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">git config user.email</text><text x="65" y="308" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">커밋 기록의 이름과 이메일</text><text x="65" y="350" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">이름은 로그인 ID일 필요 없음</text><text x="65" y="392" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">잘못 기록했다면 amend 가능</text><rect x="615" y="124" width="540" height="338" rx="15" fill="#3e3052" stroke="#334155" stroke-width="1.5"/><text x="638" y="177" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" fill="#f8fafc" font-weight="700">② GitHub Authentication</text><text x="638" y="224" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">GitHub HTTPS 원격 접속</text><text x="638" y="266" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">Username: GitHub 사용자 이름</text><text x="638" y="308" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">Password 표시에는 PAT 입력</text><text x="638" y="350" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">PAT 권한: Contents read/write</text><text x="638" y="392" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">비밀번호·토큰은 코드에 넣지 않음</text><rect x="42" y="512" width="1116" height="132" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="68" y="556" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" fill="#f8fafc" font-weight="700">noreply 이메일은 커밋 메타데이터에서 개인 메일 노출을 줄이는 선택 사항</text><text x="68" y="601" font-family="Arial,'Noto Sans KR',sans-serif" font-size="21" fill="#fbbf24" font-weight="400">토큰은 계정 비밀번호가 아니며 화면·커밋·블로그에 절대로 노출하지 않는다.</text></svg>