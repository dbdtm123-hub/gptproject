<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="22" fill="#0f172a"/><text x="42" y="62" font-family="Arial,'Noto Sans KR',sans-serif" font-size="32" fill="#f8fafc" font-weight="700">2026-10-31 우투루의 첫 GitHub push 실습 타임라인</text><rect x="42" y="121" width="1116" height="94" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><rect x="60" y="142" width="62" height="53" rx="12" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/><text x="76" y="177" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" fill="#fff" font-weight="700">01</text><text x="148" y="158" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" fill="#f8fafc" font-weight="700">Git 저장소 초기화</text><text x="148" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">~/homelab-infra 생성 → git init -b main</text><rect x="42" y="230" width="1116" height="94" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><rect x="60" y="251" width="62" height="53" rx="12" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/><text x="76" y="286" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" fill="#fff" font-weight="700">02</text><text x="148" y="267" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" fill="#f8fafc" font-weight="700">형상관리 대상과 보안 경계 정리</text><text x="148" y="301" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">.gitignore / versions.md / globals.yml.example / multinode.example</text><rect x="42" y="339" width="1116" height="94" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><rect x="60" y="360" width="62" height="53" rx="12" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/><text x="76" y="395" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" fill="#fff" font-weight="700">03</text><text x="148" y="376" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23