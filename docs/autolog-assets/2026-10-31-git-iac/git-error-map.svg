<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775"><rect width="1200" height="775" rx="22" fill="#0f172a"/><text x="42" y="62" font-family="Arial,'Noto Sans KR',sans-serif" font-size="33" fill="#f8fafc" font-weight="700">Git 첫 커밋에서 실제 만난 오류 네 가지</text><rect x="42" y="113" width="1116" height="108" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="66" y="155" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" fill="#fbbf24" font-weight="700">Author identity unknown</text><text x="66" y="194" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">작성자 정보 없음 → git config --local user.name / user.email</text><rect x="42" y="250" width="1116" height="108" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="66" y="292" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" fill="#93c5fd" font-weight="700">main does not have any commits yet</text><text x="66" y="331" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">커밋 실패 결과 → 정상 커밋 후 git log 확인</text><rect x="42" y="387" width="1116" height="108" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="66" y="429" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" fill="#c4b5fd" font-weight="700">remote 주소가 있는데 GitHub에 저장소가 없다?</text><text x="66" y="468" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">remote add는 URL만 등록 → GitHub에서 Create repository 필요</text><rect x="42" y="524" width="1116" height="108" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="66" y="566" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" fill="#86efac" font-weight="700">Username / Password for https://github.com</text><text x="66" y="605" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">HTTPS 인증 요청 → 사용자 이름 + Personal Access Token</text><rect x="42" y="670" width="1116" height="63" rx="15" fill="#204136" stroke="#334155" stroke-width="1.5"/><text x="65" y="710" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#86efac" font-weight="700">이 화면은 실제 문제의 내용만 개인정보 없이 재구성한 도식이다.</text></svg>