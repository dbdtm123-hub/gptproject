<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="22" fill="#0f172a"/><text x="42" y="62" font-family="Arial,'Noto Sans KR',sans-serif" font-size="33" fill="#f8fafc" font-weight="700">Git 형상관리, 비밀정보 관리, 데이터 백업은 서로 다른 영역</text><rect x="42" y="128" width="356" height="364" rx="15" fill="#1b3b50" stroke="#334155" stroke-width="1.5"/><text x="62" y="180" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Git 형상관리</text><text x="62" y="236" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">Inventory / globals.yml 템플릿</text><text x="62" y="284" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">Ansible / Kolla 버전</text><text x="62" y="332" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">설정 변경 이력</text><text x="62" y="380" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">재배포 문서·점검 절차</text><text x="62" y="428" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">Git diff와 리뷰</text><rect x="442" y="128" width="356" height="364" rx="15" fill="#3a2e52" stroke="#334155" stroke-width="1.5"/><text x="462" y="180" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" fill="#f8fafc" font-weight="700">별도 비밀정보 보호</text><text x="462" y="236" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">passwords.yml / Vault</text><text x="462" y="284" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">SSH 개인키·토큰</text><text x="462" y="332" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">실제 운영 환경 변수</text><text x="462" y="380" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">복호화 키 분리 보관</text><text x="462" y="428" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">최소 권한·접근 통제</text><rect x="842" y="128" width="356" height="364" rx="15" fill="#1e4337" stroke="#334155" stroke-width="1.5"/><text x="862" y="180" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" fill="#f8fafc" font-weight="700">서비스 데이터 백업</text><text x="862" y="236" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">MariaDB / RabbitMQ</text><text x="862" y="284" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">VM 디스크·볼륨</text><text x="862" y="332" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">Kubernetes PVC</text><text x="862" y="380" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">다른 장비로 복사</text><text x="862" y="428" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0" font-weight="400">복원 절차 검증</text><rect x="42" y="545" width="1156" height="119" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="69" y="592" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Git push 성공 ≠ 운영 데이터 복구 완성</text><text x="69" y="635" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#fbbf24" font-weight="400">Private Repo도 평문 비밀번호를 올리면 위험하며 .gitignore는 이미 커밋된 비밀을 지우지 못한다.</text></svg>