<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" rx="22" fill="#0f172a"/><text x="42" y="60" font-family="Arial,'Noto Sans KR',sans-serif" font-size="34" fill="#f8fafc" font-weight="700">파일 수정부터 GitHub 업로드까지 4단계</text><text x="42" y="97" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#94a3b8" font-weight="400">작업 디렉터리 / Staging Area / Commit / Remote를 분리해 이해하자</text><rect x="42" y="144" width="263" height="302" rx="15" fill="#1e3850" stroke="#334155" stroke-width="1.5"/><text x="59" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" fill="#f8fafc" font-weight="700">1. Working Tree</text><text x="59" y="260" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">파일을 편집한다</text><text x="59" y="310" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">git status --short</text><text x="59" y="360" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">?? : 아직 추적하지 않음</text><rect x="326" y="144" width="263" height="302" rx="15" fill="#1e493f" stroke="#334155" stroke-width="1.5"/><text x="343" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" fill="#f8fafc" font-weight="700">2. Stage</text><text x="343" y="260" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">커밋할 파일을 고른다</text><text x="343" y="310" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">git add &lt;파일&gt;</text><text x="343" y="360" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">A : 새 파일 등록</text><rect x="610" y="144" width="263" height="302" rx="15" fill="#353457" stroke="#334155" stroke-width="1.5"/><text x="627" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" fill="#f8fafc" font-weight="700">3. Commit</text><text x="627" y="260" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">로컬 이력으로 확정</text><text x="627" y="310" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">git commit -m</text><text x="627" y="360" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">git log로 검증</text><rect x="894" y="144" width="263" height="302" rx="15" fill="#422e53" stroke="#334155" stroke-width="1.5"/><text x="911" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" fill="#f8fafc" font-weight="700">4. GitHub</text><text x="911" y="260" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">원격 저장소 생성</text><text x="911" y="310" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">git push -u origin main</text><text x="911" y="360" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#e2e8f0" font-weight="400">GitHub 브라우저 확인</text><path d="M306,301 H321" stroke="#60a5fa" stroke-width="4"/><path d="M308,292 L321,301 L308,310" stroke="#60a5fa" stroke-width="4" fill="none"/><path d="M590,301 H605" stroke="#60a5fa" stroke-width="4"/><path d="M592,292 L605,301 L592,310" stroke="#60a5fa" stroke-width="4" fill="none"/><path d="M874,301 H889" stroke="#60a5fa" stroke-width="4"/><path d="M876,292 L889,301 L876,310" stroke="#60a5fa" stroke-width="4" fill="none"/><rect x="42" y="482" width="1116" height="145" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="65" y="526" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" fill="#f8fafc" font-weight="700">AM 표시 = 추가 후 다시 수정함. git add로 새 내용을 Stage에 올려야 한다.</text><text x="65" y="570" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#fbbf24" font-weight="400">git commit은 로컬 저장, git push는 GitHub 업로드. 두 단계가 자동으로 함께 실행되지 않는다.</text></svg>