<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><rect width="1100" height="640" rx="20" fill="#111d2f"/><text x="42" y="57" font-family="Arial,'Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#fff">클러스터는 3노드, 그러나 모든 큐가 3복제본은 아니다</text><text x="42" y="89" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#cbd5e1">실측: 총 111개 = Quorum 85개 + Stream 26개 (2026-10-27)</text>
<rect x="42" y="133" width="635" height="181" rx="17" fill="#19344a"/><text x="65" y="173" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#fff">Quorum Queue 85개</text><rect x="64" y="200" width="435" height="42" rx="8" fill="#fb923c"/><rect x="499" y="200" width="155" height="42" rx="8" fill="#38bdf8"/><text x="79" y="227" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#172033">단일 복제본 66개</text><text x="507" y="227" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="700" fill="#172033">3복제본 19개</text><text x="65" y="279" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#dbeafe">단일 복제본 66개는 node-1에만 존재</text>
<rect x="702" y="133" width="354" height="181" rx="17" fill="#21334d"/><text x="724" y="173" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#fff">Stream 26개</text><rect x="723" y="200" width="306" height="42" rx="8" fill="#a78bfa"/><text x="737" y="227" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1f1530">node-1 단독 26개</text><text x="723" y="279" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#dbeafe">장애 시 가용성 취약</text>
<text x="48" y="365" font-family="Arial,'Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#f8fafc">리더 재분산 전 → 후 (Quorum 리더 개수)</text>
<text x="59" y="420" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">node-1</text><rect x="193" y="391" width="526" height="39" rx="7" fill="#475569"/><rect x="193" y="391" width="511" height="39" rx="7" fill="#fb923c"/><text x="733" y="418" font-family="Arial" font-size="19" fill="#fff">68 → 66</text>
<text x="59" y="484" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">node-2</text><rect x="193" y="456" width="526" height="39" rx="7" fill="#475569"/><rect x="193" y="456" width="70" height="39" rx="7" fill="#38bdf8"/><text x="733" y="483" font-family="Arial" font-size="19" fill="#fff">7 → 9</text>
<text x="59" y="548" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">node-3</text><rect x="193" y="521" width="526" height="39" rx="7" fill="#475569"/><rect x="193" y="521" width="78" height="39" rx="7" fill="#a78bfa"/><text x="733" y="548" font-family="Arial" font-size="19" fill="#fff">10 → 10</text>
<text x="45" y="614" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#fbbf24">리더 이동은 “기존 복제본” 사이에서만 가능. 복제본을 새로 만드는 작업이 아니다.</text></svg>