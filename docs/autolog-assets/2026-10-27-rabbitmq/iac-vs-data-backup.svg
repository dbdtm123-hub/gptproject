<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630"><rect width="1100" height="630" rx="20" fill="#101b2b"/><text x="40" y="55" font-family="Arial,'Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Kolla-Ansible 형상관리와 데이터 백업은 다르다</text><text x="40" y="85" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#cbd5e1">업그레이드 전에 “다시 배포할 수 있는 구성”과 “복원해야 하는 상태”를 나눠 보존</text>
<rect x="52" y="135" width="450" height="308" rx="16" fill="#193650" stroke="#38bdf8" stroke-width="2"/><text x="75" y="182" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" font-weight="700" fill="#e0f2fe">① Git · IaC 형상관리</text><text x="78" y="230" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· inventory / globals.yml</text><text x="78" y="272" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· 사용자 설정 / 템플릿</text><text x="78" y="314" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· Kolla-Ansible 버전</text><text x="78" y="356" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· 컨테이너 이미지 태그 · digest</text><text x="77" y="405" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#67e8f9">재구축 가능한 “설계도”</text>
<path d="M515 280 h63" stroke="#94a3b8" stroke-width="4"/><path d="M565 270 l16 10 l-16 10" fill="none" stroke="#94a3b8" stroke-width="4"/>
<rect x="593" y="135" width="451" height="308" rx="16" fill="#37324c" stroke="#c4b5fd" stroke-width="2"/><text x="615" y="182" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" font-weight="700" fill="#f3e8ff">② 서비스 데이터 백업</text><text x="615" y="230" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· RabbitMQ 메시지 / Raft / WAL</text><text x="615" y="272" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· Quorum / Stream 상태</text><text x="615" y="314" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· MariaDB 및 볼륨 데이터</text><text x="615" y="356" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#e2e8f0">· 인증서 / Secret (암호화 관리)</text><text x="615" y="405" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#ddd6fe">과거 “실제 상태” 복구</text>
<rect x="52" y="482" width="992" height="108" rx="13" fill="#192c3b"/><text x="75" y="523" font-family="Arial,'Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#f8fafc">Kolla-Ansible = 배포 도구 · Python venv = 도구 실행환경 · Podman = 컨테이너 런타임</text><text x="75" y="556" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#fbbf24">Git rollback ≠ RabbitMQ 데이터 다운그레이드. 버전 호환성과 복원 검증이 별도로 필요하다.</text></svg>