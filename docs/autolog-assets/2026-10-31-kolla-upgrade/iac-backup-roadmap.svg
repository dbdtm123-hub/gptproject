<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="22" fill="#0f172a"/><text x="43" y="61" font-family="Arial,'Noto Sans KR',sans-serif" font-size="31" font-weight="700" fill="#f8fafc">업그레이드의 다음 과제 : Git 형상관리 ≠ 데이터 백업</text><rect x="45" y="115" width="538" height="302" rx="15" fill="#17354b" stroke="none"/><rect x="616" y="115" width="538" height="302" rx="15" fill="#3a2944" stroke="none"/><text x="68" y="166" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#7dd3fc">Git / IaC : 구성을 재현</text><text x="69" y="211" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- Kolla-Ansible 버전 고정</text><text x="69" y="249" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- multinode / globals.yml (비밀값 제거)</text><text x="69" y="287" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- 서비스별 설정·이미지 버전 명시</text><text x="69" y="325" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- 변경 전후 diff / Git commit 추적</text><text x="69" y="363" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- 롤백 가능한 설정 변경 이력</text><text x="641" y="166" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#f0abfc">백업 : 데이터를 복구</text><text x="642" y="211" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- MariaDB 백업 + 복원 테스트</text><text x="642" y="249" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- RabbitMQ 노드 데이터·큐 복제 전략</text><text x="642" y="287" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- VM 디스크 / Kubernetes PVC</text><text x="642" y="325" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- 별도 물리 장비에 백업 보관</text><text x="642" y="363" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#e2e8f0">- 복원 순서와 RPO/RTO 점검</text><rect x="45" y="450" width="1109" height="245" rx="15" fill="#1e293b" stroke="none"/><text x="70" y="493" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" font-weight="700" fill="#e2e8f0">향후 작업 순서</text><rect x="67" y="525" width="199" height="108" rx="12" fill="#1b5566" stroke="none"/><text x="81" y="563" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#f8fafc">1</text><text x="81" y="594" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#e2e8f0">Neutron 정상화</text><rect x="282" y="525" width="199" height="108" rx="12" fill="#295063" stroke="none"/><text x="296" y="563" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#f8fafc">2</text><text x="296" y="594" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#e2e8f0">Git IaC 구축</text><rect x="497" y="525" width="199" height="108" rx="12" fill="#2d4d60" stroke="none"/><text x="511" y="563" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#f8fafc">3</text><text x="511" y="594" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#e2e8f0">RabbitMQ HA</text><rect x="712" y="525" width="199" height="108" rx="12" fill="#4c475f" stroke="none"/><text x="726" y="563" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#f8fafc">4</text><text x="726" y="594" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#e2e8f0">SSD 쓰기 분석</text><rect x="927" y="525" width="199" height="108" rx="12" fill="#5a3e61" stroke="none"/><text x="941" y="563" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#f8fafc">5</text><text x="941" y="594" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#e2e8f0">4.4 격리 테스트</text><text x="55" y="726" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#fbbf24">비밀번호·토큰·개인키를 공개 Git에 저장하지 않으며 Git만으로 DB·VM·PVC를 복원할 수 없다.</text></svg>