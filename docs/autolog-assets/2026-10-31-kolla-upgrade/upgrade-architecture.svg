<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="22" fill="#0f172a"/><text x="45" y="60" font-family="Arial,'Noto Sans KR',sans-serif" font-size="31" font-weight="700" fill="#f8fafc">OpenStack 업그레이드 중 VM과 AutoLog는 어떻게 영향을 받았나?</text><text x="46" y="95" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#94a3b8">3대 물리 호스트의 관리 계층과 기존 VM 워크로드를 분리해 살펴본다</text><rect x="45" y="127" width="355" height="230" rx="15" fill="#1e293b" stroke="none"/><rect x="423" y="127" width="355" height="230" rx="15" fill="#1e293b" stroke="none"/><rect x="801" y="127" width="355" height="230" rx="15" fill="#1e293b" stroke="none"/><text x="66" y="165" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#93c5fd">openstack01 · 우투루</text><text x="67" y="204" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Controller + Network + Compute</text><text x="67" y="232" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">RabbitMQ / MariaDB / Neutron</text><text x="67" y="260" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Nova / OVS / HAProxy</text><text x="444" y="165" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#93c5fd">openstack02 · 서팔이</text><text x="445" y="204" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Controller + Compute</text><text x="445" y="232" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">RabbitMQ / MariaDB</text><text x="445" y="260" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Nova / VM 워크로드</text><text x="822" y="165" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#93c5fd">openstack03 · 케식이</text><text x="823" y="204" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Controller</text><text x="823" y="232" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">RabbitMQ / MariaDB</text><text x="823" y="260" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">클러스터 참여</text><rect x="45" y="382" width="1110" height="65" rx="12" fill="#334155" stroke="none"/><text x="70" y="422" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Kolla-Ansible 2026.1 → 2026.2   |   컨테이너 교체·DB 마이그레이션·Neutron 오류</text><path d="M600,450 L600,483" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="45" y="489" width="1110" height="103" rx="12" fill="#153449" stroke="none"/><text x="70" y="528" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#7dd3fc">Nova / libvirt / qemu-kvm</text><text x="70" y="564" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#e2e8f0">관리 컨테이너가 재시작되어도 기존 VM 프로세스는 유지될 수 있다 (무중단 보장은 아님)</text><path d="M600,592 L600,617" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="45" y="626" width="1110" height="89" rx="12" fill="#183b33" stroke="none"/><text x="70" y="663" font-family="Arial,'Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#86efac">Kubernetes (cp01, worker01, worker02) → Cloudflared / PostgreSQL / AutoLog</text><text x="70" y="695" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#d1fae5">관측: worker01 NotReady → Pod 재배치·DB Ready 실패 → 복구 → AutoLog 재접속</text></svg>