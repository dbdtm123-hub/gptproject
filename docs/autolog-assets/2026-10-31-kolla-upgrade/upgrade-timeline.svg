,sans-serif" font-size="22" font-weight="700" fill="#f87171">업그레이드 중 Neutron 실패</text><text x="168" y="438" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">L3 Agent 재시작: Podman 404 (이전 컨테이너 ID 조회 실패)</text><text x="168" y="460" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">후속 neutron_check_contract_db_stdout 변수 미생성</text><rect x="88" y="499" width="30" height="30" rx="15" fill="#fbbf24" stroke="none"/><rect x="144" y="488" width="1007" height="100" rx="14" fill="#1e293b" stroke="none"/><text x="168" y="520" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#fbbf24">서비스 영향과 복구</text><text x="168" y="549" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">worker01 NotReady / PostgreSQL Ready 실패 / AutoLog 접속 장애</text><text x="168" y="571" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">L3 Agent 수동 start → Healthy, worker01 Ready / AutoLog 접속 회복</text><rect x="88" y="610" width="30" height="30" rx="15" fill="#93c5fd" stroke="none"/><rect x="144" y="599" width="1007" height="100" rx="14" fill="#1e293b" stroke="none"/><text x="168" y="631" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#93c5fd">부분 업그레이드 상태</text><text x="168" y="660" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">RabbitMQ 전 노드 4.3.6, 알람·네트워크 파티션 없음</text><text x="168" y="682" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">Neutron DB 마이그레이션·전체 upgrade 최종 성공 미확인</text><text x="45" y="711" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#fbbf24">주의: 시간상 연관은 있으나 OpenStack 업그레이드가 모든 장애의 직접 원인이라고 확정할 수는 없다.</text></svg>