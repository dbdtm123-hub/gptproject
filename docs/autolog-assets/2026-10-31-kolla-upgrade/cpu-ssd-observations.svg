<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755"><rect width="1200" height="755" rx="22" fill="#0f172a"/><text x="46" y="62" font-family="Arial,'Noto Sans KR',sans-serif" font-size="32" font-weight="700" fill="#f8fafc">RabbitMQ 4.2.9 → 4.3.6 : 전후 관측과 해석</text><text x="46" y="95" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#94a3b8">같은 유형의 측정값 비교. 원인 입증이나 장시간 평균으로 간주하지 않는다.</text><rect x="44" y="130" width="545" height="227" rx="15" fill="#1e293b" stroke="none"/><rect x="610" y="130" width="545" height="227" rx="15" fill="#1e293b" stroke="none"/><text x="68" y="175" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#e2e8f0">CPU (podman stats 순간값)</text><text x="75" y="226" font-family="Arial,'Noto Sans KR',sans-serif" font-size="33" font-weight="700" fill="#fb7185">262.69%</text><text x="341" y="226" font-family="Arial,'Noto Sans KR',sans-serif" font-size="30" font-weight="700" fill="#86efac">→  51.90%</text><rect x="74" y="245" width="475" height="20" rx="10" fill="#334155" stroke="none"/><rect x="74" y="245" width="94" height="20" rx="10" fill="#34d399" stroke="none"/><text x="73" y="304" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">최고치 대비 약 80% 낮은 관측값</text><text x="635" y="175" font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#e2e8f0">RabbitMQ 프로세스 쓰기 요청</text><text x="636" y="226" font-family="Arial,'Noto Sans KR',sans-serif" font-size="31" font-weight="700" fill="#fb7185">11.0 MB/s</text><text x="886" y="226" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="700" fill="#86efac">→ 2.33 MB/s</text><rect x="638" y="245" width="477" height="20" rx="10" fill="#334155" stroke="none"/><rect x="638" y="245" width="101" height="20" rx="10" fill="#34d399" stroke="none"/><text x="638" y="304" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">pidstat 5초 표본, 약 79% 감소</text><rect x="44" y="386" width="1110" height="240" rx="15" fill="#1e293b" stroke="none"/><text x="68" y="435" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" font-weight="700" fill="#e2e8f0">SSD 직접 측정 : SK hynix Platinum P41 1TB</text><text x="73" y="480" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="700" fill="#fbbf24">5분 쓰기 2,457.6MB</text><text x="550" y="480" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="700" fill="#fbbf24">평균 8.19MB/s</text><text x="73" y="525" font-family="Arial,'Noto Sans KR',sans-serif" font-size="21" font-weight="400" fill="#e2e8f0">SMART 내구 소모 추정 17%</text><text x="550" y="525" font-family="Arial,'Noto Sans KR',sans-serif" font-size="21" font-weight="400" fill="#e2e8f0">누적 쓰기 41.2TB</text><text x="73" y="570" font-family="Arial,'Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#86efac">오류 0 · 예비 영역 100%</text><text x="68" y="662" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#fbbf24">해석 주의 ① 컨테이너 누적 Block I/O는 재생성 시 초기화된다.</text><text x="68" y="698" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#fbbf24">해석 주의 ② SSD 전체 쓰기는 RabbitMQ 이외의 VM·OS·OpenStack 작업까지 포함한다.</text></svg>