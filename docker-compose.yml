# Development/integration tests only. Production: Podman + Kubernetes/containerd.
name: lifelog

x-backend: &backend
  image: lifelog-backend:local
  build:
    context: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lifelog}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lifelog}
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lifelog}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lifelog}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lifelog}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ENABLE_OPENAI_CLASSIFICATION: ${ENABLE_OPENAI_CLASSIFICATION:-false}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env (32+ characters)}
      ACTION_SERVER_URL: ${ACTION_SERVER_URL:-https://autolog.example.com}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: autolog-frontend:test
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      APP_USERNAME: ${APP_USERNAME:-autolog}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env (32+ characters)}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10

volumes:
  postgres_data:
