name: AutoLog production deploy (manual)

# This workflow NEVER runs on pushes or pull requests.
# To enable the Run workflow button, GitHub requires the workflow on
# the repository's default branch as well as the selected deployment ref.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "40-character SHA already built and published by successful work CI"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY-LIFELOG after reviewing backup, migrations and rollout"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autolog-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manual release request
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit confirmation and full commit SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be 40 lowercase hexadecimal characters" >&2
            exit 1
          }
          [[ "$CONFIRMATION" == "DEPLOY-LIFELOG" ]] || {
            echo "Confirmation must be DEPLOY-LIFELOG" >&2
            exit 1
          }

  deploy:
    name: Manually approved Kubernetes application rollout
    needs: [validate]
    # No runner with the special label => the job remains queued, not deployed.
    # Use a dedicated private runner with an RBAC-limited kubeconfig.
    runs-on: [self-hosted, linux, x64, autolog-deployer]
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      AUTOLOG_CONFIRM_DEPLOY: DEPLOY-LIFELOG
      # KUBECONFIG must be provided only on the private deployment runner.
      # Do not add an unrestricted kubeconfig as an Actions repo secret.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release is in trusted work history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin work
          git merge-base --is-ancestor "$RELEASE_SHA" origin/work
      - name: Preview exact Deployment image changes
        shell: bash
        run: bash scripts/deploy-autolog.sh "$RELEASE_SHA"
      - name: Apply approved release and wait for rollouts
        shell: bash
        run: bash scripts/deploy-autolog.sh "$RELEASE_SHA" --apply
