name: AutoLog Kubernetes kubeconfig auth (read-only)

# Manual approval-gated identity/TLS/RBAC smoke test; never deploys.
on:
  workflow_dispatch:

permissions: {}

jobs:
  kubeconfig-check:
    name: Validate restricted Kubernetes identity over Tailscale
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15

    steps:
      - name: Require production-only credentials
        shell: bash
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          KC_B64: ${{ secrets.AUTOLOG_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$TS_ID" || -z "$TS_SECRET" || -z "$KC_B64" ]]; then
            echo "::error::Missing required production Environment Secrets."
            exit 1
          fi

      - name: Connect GitHub runner over Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:autolog-cd

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.5

      - name: Load restricted kubeconfig (never print credentials)
        shell: bash
        env:
          KC_B64: ${{ secrets.AUTOLOG_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          cfg="$RUNNER_TEMP/autolog-readonly.kubeconfig"
          printf '%s' "$KC_B64" | base64 --decode > "$cfg"
          chmod 600 "$cfg"
          echo "KUBECONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Verify certificate, identity, and RBAC without changes
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking the API with kubeconfig CA validation (no --insecure flag)."
          kubectl --request-timeout=15s -n lifelog get deployment \
            lifelog-backend lifelog-frontend image-gateway \
            -o 'custom-columns=NAME:.metadata.name,READY:.status.readyReplicas'
          echo "Checking scoped deployment patch permission (dry permission query only)."
          patch="$(kubectl --request-timeout=15s -n lifelog auth can-i patch deployment/lifelog-backend)"
          echo "Patch deployment/lifelog-backend: $patch"
          test "$patch" = yes
          # kubectl auth can-i deliberately exits 1 when access is denied.
          # With set -e, that expected denial must be captured explicitly.
          secret_status=0
          readsecret="$(kubectl --request-timeout=15s -n lifelog auth can-i get secrets)" || secret_status=$?
          echo "Read secrets: $readsecret (exit $secret_status)"
          if [[ "$readsecret" != "no" || "$secret_status" -ne 1 ]]; then
            echo "::error::Expected RBAC denial (no, exit code 1) for secrets."
            exit 1
          fi
          echo "Authenticated network + TLS + limited RBAC verification succeeded."
