name: AutoLog Tailscale API connectivity (read-only)

# Separate from production deployment: never calls kubectl or changes a cluster.
# Manual trigger only, and production approval is required for OAuth secrets.
on:
  workflow_dispatch:

permissions: {}

jobs:
  tailnet-check:
    name: Check GitHub runner to Kubernetes API TCP 6443
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15

    steps:
      - name: Require protected Tailscale OAuth secrets
        shell: bash
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$TS_ID" || -z "$TS_SECRET" ]]; then
            echo "::error::Missing production Environment Tailscale OAuth secrets."
            exit 1
          fi

      - name: Join Tailscale as the restricted CD tag
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:autolog-cd
          # v4 already sets --accept-routes; do not pass it twice via args.

      - name: Read-only TCP and HTTPS probe of Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://192.168.219.240:6443/version"
          echo "Testing a Kubernetes API HTTPS response over Tailscale (no kubeconfig or token)."
          echo "TLS name verification is intentionally skipped for this NETWORK-ONLY test;"
          echo "the production CD must use the verified cluster CA and tls-server-name."
          for attempt in 1 2 3 4 5 6 7 8; do
            if status="$(curl --insecure --noproxy '*' --silent --show-error \
                --connect-timeout 5 --max-time 10 --output /dev/null \
                --write-out '%{http_code}' "$endpoint")"; then
              echo "Attempt $attempt: HTTP $status"
              if [[ "$status" == "200" || "$status" == "401" || "$status" == "403" ]]; then
                echo "Kubernetes API reached from the GitHub-hosted runner."
                echo "NOTE: This is NOT a kubectl authentication test or a deployment."
                exit 0
              fi
            else
              echo "Attempt $attempt: TLS/TCP connection unsuccessful."
            fi
            if [[ "$attempt" -lt 8 ]]; then sleep 5; fi
          done
          echo "::error::GitHub runner could not reach the Kubernetes API."
          exit 1
