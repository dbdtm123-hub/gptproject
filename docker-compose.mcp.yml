# Development extension only; never starts the existing production stack.
# Example: docker compose -f docker-compose.yml -f docker-compose.mcp.yml up --build mcp
services:
  mcp:
    build: ./backend
    command: [uvicorn, app.mcp_server:app, --host, 0.0.0.0, --port, '8080', --workers, '1', --limit-concurrency, '8', --no-access-log]
    env_file: .env.mcp
    environment:
      AUTOLOG_MCP_BACKEND_URL: http://backend:8000
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    mem_limit: 512m
