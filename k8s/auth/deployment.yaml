apiVersion: v1
kind: ServiceAccount
metadata:
  name: autolog-auth
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autolog-auth
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autolog-auth
  template:
    metadata:
      labels:
        app: autolog-auth
    spec:
      serviceAccountName: autolog-auth
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authelia
          # Replace with a reviewed digest in the release overlay; never use latest.
          image: ghcr.io/authelia/authelia:4.39.28
          command: [authelia]
          args: [--config, /config/configuration.yml, --config.experimental.filters=template]
          ports:
            - name: http
              containerPort: 9091
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: autolog-auth-config
        - name: secrets
          secret:
            secretName: autolog-auth
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: autolog-auth-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
