apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autolog-auth-data
spec:
  # Fail closed if somebody applies the base without a reviewed release overlay.
  # Release renderer replaces this placeholder with a local/block StorageClass.
  storageClassName: REPLACE_WITH_NON_NFS_STORAGE_CLASS
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
