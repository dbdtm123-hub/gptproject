apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autolog-auth-isolation
spec:
  podSelector:
    matchLabels:
      app: autolog-auth
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 9091
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-autolog-auth-egress
spec:
  podSelector:
    matchLabels:
      app: cloudflared
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: autolog-auth
      ports:
        - protocol: TCP
          port: 9091
