# Authelia 4.39.28 candidate. Validate with this exact version before deployment.
# Activate the template filter: --config.experimental.filters=template
server:
  address: tcp://:9091/
  disable_healthcheck: true
log:
  level: info
  format: json
telemetry:
  metrics:
    enabled: false
ntp:
  disable_startup_check: true # Nodes must already have working time synchronization.
authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /secrets/users.yml
access_control:
  default_policy: deny
session:
  name: autolog_auth_session
  secret: '{{ secret "/secrets/session" }}'
  same_site: lax
  inactivity: 5m
  expiration: 1h
  remember_me: -1
  cookies:
    - domain: auth.example.com
      authelia_url: https://auth.example.com
storage:
  encryption_key: '{{ secret "/secrets/storage" }}'
  local:
    path: /data/db.sqlite3
notifier:
  filesystem:
    filename: /data/notifications.txt
identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/secrets/reset" }}'
identity_providers:
  oidc:
    hmac_secret: '{{ secret "/secrets/hmac" }}'
    jwks:
      - key: {{ secret "/secrets/oidc.pem" | mindent 10 "|" | msquote }}
        algorithm: RS256
        use: sig
    enforce_pkce: always
    enable_pkce_plain_challenge: false
    enable_jwt_access_token_stateless_introspection: false
    authorization_policies:
      introspection_denied:
        default_policy: deny
      owner:
        default_policy: deny
        rules:
          - policy: two_factor
            subject: user:owner
    lifespans:
      access_token: 5m
      authorize_code: 1m
      refresh_token: 24h
    scopes:
      'autolog:read': {}
      'autolog:write': {}
    clients:
      - client_id: autolog-chatgpt
        client_name: AutoLog ChatGPT
        client_secret: '{{ secret "/secrets/chatgpt.hash" }}'
        public: false
        authorization_policy: owner
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://REPLACE-WITH-EXACT-CHATGPT-CALLBACK.invalid/callback
        audience:
          - https://mcp.example.com/mcp
        requested_audience_mode: explicit
        scopes: [openid, offline_access, 'autolog:read', 'autolog:write']
        grant_types: [authorization_code, refresh_token]
        response_types: [code]
        response_modes: [query]
        consent_mode: explicit
        authorization_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
        access_token_signed_response_alg: none
      - client_id: autolog-resource-server
        client_name: AutoLog introspection only
        client_secret: '{{ secret "/secrets/introspection.hash" }}'
        public: false
        authorization_policy: introspection_denied
        scopes: []
        grant_types: [client_credentials]
        response_types: []
        audience: []
        introspection_endpoint_auth_method: client_secret_basic
        introspection_signed_response_alg: none
