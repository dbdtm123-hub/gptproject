apiVersion: batch/v1
kind: Job
metadata:
  name: lifelog-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: lifelog-migrate
    spec:
      serviceAccountName: lifelog
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: autolog/backend:latest
          imagePullPolicy: Always
          command: [alembic, upgrade, head]
          envFrom:
            - configMapRef:
                name: lifelog-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lifelog-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
