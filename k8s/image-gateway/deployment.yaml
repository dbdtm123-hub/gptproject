apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-gateway
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: image-gateway
  template:
    metadata:
      labels:
        app: image-gateway
    spec:
      serviceAccountName: image-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-gateway
          image: autolog/image-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: image-gateway-config
          env:
            - name: GATEWAY_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lifelog-garage-reader
                  key: S3_ACCESS_KEY
            - name: GATEWAY_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lifelog-garage-reader
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
