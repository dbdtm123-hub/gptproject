apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-access
spec:
  endpointSelector:
    matchLabels:
      app: lifelog-frontend
  ingress:
    - fromEntities: [world, ingress, host, remote-node]
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-openai
spec:
  endpointSelector:
    matchLabels:
      app: lifelog-backend
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.openai.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
