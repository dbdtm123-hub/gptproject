apiVersion: v1
kind: ServiceAccount
metadata:
  name: autolog-mcp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autolog-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: autolog-mcp
  template:
    metadata:
      labels:
        app: autolog-mcp
    spec:
      serviceAccountName: autolog-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Reuse the backend image; choose an immutable reviewed SHA before rollout.
          image: autolog/backend:latest
          command: [uvicorn, app.mcp_server:app, --host, 0.0.0.0, --port, '8080', --workers, '1', --limit-concurrency, '8', --no-access-log]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: autolog-mcp-config
          env:
            - name: AUTOLOG_MCP_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lifelog-api
                  key: API_TOKEN
            - name: AUTOLOG_MCP_INTROSPECTION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: autolog-mcp-oauth
                  key: INTROSPECTION_CLIENT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
